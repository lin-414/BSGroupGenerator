<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>BS Group Generator</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="titlebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/>
        <rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/>
        <path d="M15 17l2.2 2.2L21.5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="title">BS Group Generator</span>
      <span class="subtitle">BodySlide 分组工具</span>
    </div>
    <div class="win-controls">
      <button data-win="min" title="最小化">&#x2500;</button>
      <button data-win="max" id="btnMax" title="最大化 / 还原">&#x25A1;</button>
      <button data-win="close" class="close" title="关闭">&#x2715;</button>
    </div>
  </header>

  <main id="app">
    <section id="setup" class="card">
      <div class="row">
        <label>MO2 实例</label>
        <select id="cboInstances" class="fill"></select>
        <button id="btnRefreshInstances">刷新</button>
        <button id="btnAddMo2">添加 MO2 目录…</button>
      </div>
      <div class="row">
        <label>配置 Profile</label>
        <select id="cboProfiles" class="fill"></select>
      </div>
      <div class="row">
        <label>BodySlide</label>
        <select id="cboBodySlide" class="fill"></select>
        <button id="btnDetectBs">自动检测</button>
        <button id="btnBrowseBs">浏览…</button>
      </div>
      <div class="row">
        <label>输出位置</label>
        <select id="cboWriteMode" class="fill">
          <option value="Auto">自动（推荐）</option>
          <option value="BodySlideDir">BodySlide 程序目录</option>
          <option value="Mo2Mod">MO2 专用模组</option>
          <option value="RealGameData">游戏真实 Data</option>
          <option value="Custom">自定义（浏览选择）</option>
        </select>
        <button id="btnBrowseTarget">浏览…</button>
      </div>
      <div id="infoLine" class="info">正在初始化…</div>
    </section>

    <section id="workspace">
      <div id="left">
        <div class="toolbar">
          <input id="txtFilter" placeholder="过滤服装 / 模组…" spellcheck="false">
          <label class="check"><input type="checkbox" id="chkUnassigned"> 仅看未分配</label>
          <label class="check"><input type="checkbox" id="chkExpand"> 展开全部模组</label>
        </div>
        <div id="tree"></div>
        <div id="treeFoot" class="foot"></div>
      </div>
      <div id="right">
        <div class="panel-title">分组（选中组 → 左侧勾选 → 「加入当前组」）</div>
        <div id="groupList"></div>
        <div class="btn-row">
          <button id="btnNewGroup">新建组</button>
          <button id="btnRenameGroup">重命名</button>
          <button id="btnDeleteGroup">删除组</button>
          <button id="btnViewGroup">查看组</button>
        </div>
        <div class="btn-row apply">
          <button id="btnApplyAdd" class="primary">加入当前组</button>
          <button id="btnApplyRemove">移出当前组</button>
        </div>
        <div class="btn-row">
          <button id="btnImport">导入现有组文件…</button>
          <button id="btnSave" class="primary">保存分组文件</button>
        </div>
        <div id="groupInfo" class="muted"></div>
      </div>
    </section>
  </main>

  <div id="logDrawer" hidden><pre id="logText"></pre></div>
  <footer id="statusbar">
    <span class="left">
      <button id="btnDiag" class="link">诊断</button>
      <button id="btnLogToggle" class="link">日志</button>
      <span id="scanBadge" class="badge" hidden>扫描中…</span>
      <span id="countsText"></span>
    </span>
    <span class="right" id="targetText"></span>
  </footer>

  <dialog id="inputDialog">
    <form method="dialog" id="inputForm">
      <h3 id="inputTitle">输入</h3>
      <input id="inputValue" spellcheck="false" autocomplete="off">
      <div class="dialog-actions">
        <button value="cancel" type="button" id="inputCancel">取消</button>
        <button value="ok" id="inputOk" class="primary">确定</button>
      </div>
    </form>
  </dialog>

  <dialog id="membersDialog">
    <h3 id="membersTitle">组成员</h3>
    <input id="membersFilter" placeholder="过滤成员…" spellcheck="false">
    <div id="membersTree"></div>
    <div class="muted" id="membersCount"></div>
    <div class="dialog-actions">
      <button id="membersClose" type="button">关闭</button>
      <button id="membersRemove" class="primary">移出所选</button>
    </div>
  </dialog>

  <dialog id="diagDialog">
    <h3>诊断信息</h3>
    <pre id="diagText"></pre>
    <div class="dialog-actions">
      <button id="diagClose" type="button">关闭</button>
      <button id="diagCopy" class="primary">复制全部</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
