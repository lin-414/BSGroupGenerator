name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布（自包含，用户无需安装运行时）
        run: >
          dotnet publish src/BSGroupGenerator.Wpf/BSGroupGenerator.Wpf.csproj
          -c Release -r win-x64 --self-contained true
          /p:DebugType=none
          /p:AllowedReferenceRelatedFileExtensions=none
          -o publish

      - name: 打包 zip
        run: Compress-Archive -Path publish/* -DestinationPath "BSGroupGenerator-${{ github.ref_name }}-win-x64.zip"

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          "BSGroupGenerator-${{ github.ref_name }}-win-x64.zip"
